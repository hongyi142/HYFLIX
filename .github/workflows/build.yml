name: Build HyFLIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build Standard APK
        run: flutter build apk --release --target lib/main.dart
        
      - name: Prepare Standard APKs
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/hyflix-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/hyflix-android-tv.apk

      - name: Build Projector (Low-Memory) APK
        run: flutter build apk --release --target lib/main_projector.dart

      - name: Prepare Projector APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/hyflix-projector.apk

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyflix-android-apks
          path: build/dist/*.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1.9
          name: HyFLIX v1.1.9
          files: |
            build/dist/hyflix-android.apk
            build/dist/hyflix-android-tv.apk
            build/dist/hyflix-projector.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Create macOS project if missing
        run: flutter create --platforms=macos .
        
      - name: Enable macOS build
        run: flutter config --enable-macos-desktop
        
      - name: Build macOS App
        run: flutter build macos --release
        
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "HyFLIX" -srcfolder hyflix.app -ov -format UDZO HyFLIX.dmg
          
      - name: Upload DMG to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyflix-macos-dmg
          path: build/macos/Build/Products/Release/HyFLIX.dmg

      - name: Publish DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1.9
          name: HyFLIX v1.1.9
          files: |
            build/macos/Build/Products/Release/HyFLIX.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

