name: Build HyFLIX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Prepare Release APKs
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/hyflix-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/hyflix-android-tv.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/hyflix-projector.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hyflix-android-apks
          path: build/dist/*.apk

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Create macOS project if missing
        run: flutter create --platforms=macos .
        
      - name: Enable macOS build
        run: flutter config --enable-macos-desktop
        
      - name: Build macOS App
        run: flutter build macos --release
        
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "HyFLIX" -srcfolder hyflix.app -ov -format UDZO HyFLIX.dmg
          
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: hyflix-macos-dmg
          path: build/macos/Build/Products/Release/HyFLIX.dmg
